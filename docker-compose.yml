name: BardBoardAndDragons

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  bard-board-web:
    build:
      context: .
      args:
        BACKEND_URL: http://bard-board-bot:${BOT_PORT:-3001}
        UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-50}
    image: bardboard:local
    container_name: ${WEB_CONTAINER_NAME:-web}
    command: ["node", "node_modules/next/dist/bin/next", "start"]
    ports:
      - "${WEB_PORT:-3000}:${WEB_PORT:-3000}"
    restart: always
    init: true
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    environment:
      - BACKEND_URL=http://bard-board-bot:${BOT_PORT:-3001}
      - PORT=${WEB_PORT:-3000}
    depends_on:
      bard-board-bot:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + process.env.PORT + '/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  bard-board-bot:
    image: bardboard:local
    container_name: ${BOT_CONTAINER_NAME:-bot}
    command: ["node", "server/app.js"]
    restart: always
    init: true
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    env_file:
      - path: .env
        required: false
    environment:
      - BARDBOARD_ENV_PATH=/usr/src/app/config/.env
      - BACKEND_URL=http://localhost:3001
      - BOT_PORT=${BOT_PORT:-3001}
      - UPLOAD_MAX_MB=${UPLOAD_MAX_MB:-50}
      - SESSION_DIR=/usr/src/app/sessions
    volumes:
      - ./audio-files:/usr/src/app/audio-files
      - ${SESSION_HOST_DIR:-./sessions}:/usr/src/app/sessions
      - bardboard-config:/usr/src/app/config
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + process.env.BOT_PORT + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  bardboard-config:

